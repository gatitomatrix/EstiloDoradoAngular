<ed-web-barra-superior></ed-web-barra-superior>
<ed-web-franja-marca></ed-web-franja-marca>

<section class="container" style="max-width: 760px;">
    <div class="card shadow-sm my-4">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Nueva contraseña</h3>

            <div class="alert alert-success" *ngIf="fromCheck">
                Si el correo está registrado, te enviamos un código de 6 dígitos. Revisa bandeja de entrada y spam.
            </div>

            <form [formGroup]="form" class="d-grid gap-3" (ngSubmit)="crear()">

                <div>
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" placeholder="tu@correo.com" formControlName="email">
                </div>

                <div>
                    <label class="form-label">Código de 6 dígitos</label>
                    <input type="text" class="form-control" inputmode="numeric" maxlength="6"
                        placeholder="000000" formControlName="codigo">
                </div>

                <div>
                    <label class="form-label">Nueva contraseña</label>
                    <div class="input-group">
                        <input [type]="hide ? 'password' : 'text'" class="form-control"
                            placeholder="Mínimo 6 caracteres" formControlName="password">
                        <button type="button" class="btn btn-outline-secondary" (click)="hide=!hide">👁</button>
                    </div>
                    <ul class="small mt-2">
                        <li [class.text-success]="reqLen">Mín. 6 caracteres</li>
                        <li [class.text-success]="reqMatch">Las dos claves coinciden</li>
                    </ul>
                </div>

                <div>
                    <label class="form-label">Confirmar contraseña</label>
                    <input [type]="hide ? 'password' : 'text'" class="form-control"
                        formControlName="password_confirmation">
                </div>

                <div class="alert alert-danger py-2" *ngIf="err">{{ err }}</div>

                <button class="btn btn-dark fw-bold py-2" type="submit" [disabled]="form.invalid || submitting">
                    {{ submitting ? 'Guardando…' : 'Guardar y entrar' }}
                </button>
            </form>

            <div class="text-center mt-3 text-muted">
                ¿No te llegó?
                <a class="link-primary text-decoration-underline" routerLink="/recuperar">Pedir otro código</a>
            </div>
        </div>
    </div>
</section>
