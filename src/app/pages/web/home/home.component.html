<ed-web-franja-marca></ed-web-franja-marca>
<ed-web-barra-superior></ed-web-barra-superior>
<ed-web-carrusel-hero></ed-web-carrusel-hero>
<ed-web-cinta-promocion
  texto="¡35% de descuento en arreglos florales por primavera!"
  textoBoton="Ver Productos"
  url="#productos"
  [mostrarBoton]="true"
>
</ed-web-cinta-promocion>

<div class="ed-chips-busqueda-row">
  <div class="ed-chips-busqueda-row__chips">
    <ed-web-chips-categorias
      [categorias]="chips"
      (seleccionarCategoria)="onChip($event)"
    >
    </ed-web-chips-categorias>
  </div>

  <div class="ed-chips-busqueda-row__search">
    <ed-web-barra-busqueda (buscar)="onBuscarSecundario($event)"></ed-web-barra-busqueda>
  </div>
</div>

<section id="productos" class="ed-content-row">
  <div class="ed-content-row__left">
    <ed-web-panel-filtros
      (changeCategoria)="onCategoriaChange($event)"
      [precioMinDisponible]="precioMinDisponible"
      [precioMaxDisponible]="precioMaxDisponible"
      [precioMinSel]="precioMinSel"
      [precioMaxSel]="precioMaxSel"
      (precioChange)="onPrecioChange($event)"
    >
    </ed-web-panel-filtros>
  </div>

  <div class="ed-content-row__right">
    <div *ngIf="categoriaNombre" class="ed-search-banner" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <span>Categoría: <strong>{{ categoriaNombre }}</strong> ({{ productos.length }})</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onCategoriaChange({ id: null, nombre: null })">Ver todas</button>
    </div>

    <div *ngIf="loading" class="ed-loading">Cargando productos…</div>
    <div *ngIf="error" class="ed-error">
      {{ error }}
      <button type="button" class="btn btn-sm btn-dark ms-2" (click)="clearSearch(); cargarProductos()">Reintentar</button>
    </div>

    <ed-web-grilla-productos
      *ngIf="!loading && !error"
      [productos]="productos"
      [loading]="loading"
      (addToCart)="onAddToCart($event)"
      (openDetail)="onOpenDetail($event)"
    >
    </ed-web-grilla-productos>
  </div>
</section>
