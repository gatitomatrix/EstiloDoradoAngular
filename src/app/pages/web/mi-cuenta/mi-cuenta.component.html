<ed-web-barra-superior></ed-web-barra-superior>
<ed-web-franja-marca></ed-web-franja-marca>

<section class="ed-account">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
    <a routerLink="/" class="btn btn-link text-decoration-none" style="color:#2D2418;padding-left:0;">← Volver al inicio</a>
    <div style="display:flex;gap:8px;">
      <a routerLink="/mis-compras" class="btn btn-outline-dark btn-sm">Mis compras</a>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
  <h1>Hola, {{ (user$ | async)?.nombre || 'Cliente' }}</h1>

  <div class="ed-card">
    <div class="ed-card__header">
      <h2>Datos personales</h2>
      <button class="ed-link" *ngIf="!edit" (click)="edit = true">Editar</button>
    </div>

    <form [formGroup]="form" class="ed-grid">
      <div>
        <label>Nombre</label>
        <input type="text" formControlName="nombre" [readonly]="!edit"
          (input)="onNameInput('nombre', $event)" placeholder="Solo letras">
      </div>

      <div>
        <label>Apellido</label>
        <input type="text" formControlName="apellido" [readonly]="!edit"
          (input)="onNameInput('apellido', $event)" placeholder="Solo letras">
      </div>

      <div>
        <label>Teléfono</label>
        <input type="tel" formControlName="telefono" [readonly]="!edit"
          (input)="onPhoneInput($event)" inputmode="numeric" maxlength="9" placeholder="9xxxxxxxx">
      </div>

      <div>
        <label>Dirección</label>
        <input type="text" formControlName="direccion" [readonly]="!edit">
      </div>

      <div>
        <label>Correo</label>
        <input type="email" formControlName="email" readonly>
      </div>
    </form>

    <p class="text-success" *ngIf="saveMsg">{{ saveMsg }}</p>
    <p class="text-danger" *ngIf="saveErr">{{ saveErr }}</p>

    <div class="ed-actions" *ngIf="edit">
      <button class="ed-btn ed-btn--ghost" (click)="cancelar()">Cancelar</button>
      <button class="ed-btn ed-btn--primary" (click)="guardar()" [disabled]="form.invalid">Guardar cambios</button>
    </div>
  </div>

  <div class="ed-card" style="margin-top:20px;">
    <div class="ed-card__header">
      <h2>Contraseña</h2>
    </div>
    <p class="text-muted" style="margin-top:0;">Si creaste la cuenta con correo. Si solo usas Google, pide un código en “¿Olvidaste tu contraseña?”.</p>
    <form [formGroup]="passForm" class="ed-grid" (ngSubmit)="cambiarClave()">
      <div>
        <label>Contraseña actual</label>
        <input type="password" formControlName="actual" autocomplete="current-password">
      </div>
      <div>
        <label>Nueva (mín. 6)</label>
        <input type="password" formControlName="nueva" autocomplete="new-password">
      </div>
      <div>
        <label>Confirmar nueva</label>
        <input type="password" formControlName="confirma" autocomplete="new-password">
      </div>
    </form>
    <p class="text-success" *ngIf="passMsg">{{ passMsg }}</p>
    <p class="text-danger" *ngIf="passErr">{{ passErr }}</p>
    <div class="ed-actions">
      <button class="ed-btn ed-btn--primary" type="button" (click)="cambiarClave()" [disabled]="passBusy">
        {{ passBusy ? 'Guardando…' : 'Cambiar contraseña' }}
      </button>
      <a routerLink="/recuperar" class="ed-link">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</section>
