<ed-web-barra-superior></ed-web-barra-superior>
<ed-web-franja-marca></ed-web-franja-marca>

<section class="container" style="max-width: 760px;">
    <div class="card shadow-sm my-4">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Recuperar contraseña</h3>
            <p class="text-muted">Te enviamos un código de 6 dígitos al correo (válido 60 minutos). También llega un enlace para abrirlo aquí.</p>

            <form [formGroup]="form" class="d-grid gap-3" (ngSubmit)="continuar()">
                <div>
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" placeholder="nombre@ejemplo.com" formControlName="email">
                    <div class="form-text text-danger" *ngIf="emailCtrl.touched && emailCtrl.hasError('email')">
                        Ingresa un correo válido
                    </div>
                </div>

                <div class="alert alert-danger py-2" *ngIf="err">{{ err }}</div>

                <button class="btn btn-dark fw-bold py-2" type="submit" [disabled]="form.invalid || sending">
                    {{ sending ? 'Enviando…' : 'Enviar código' }}
                </button>
            </form>

            <div class="text-center mt-3">
                <a class="link-primary text-decoration-underline" routerLink="/restablecer">Ya tengo el código</a>
            </div>
            <div class="text-center mt-2">
                <a routerLink="/" class="text-muted">Volver al inicio</a>
            </div>
        </div>
    </div>
</section>
