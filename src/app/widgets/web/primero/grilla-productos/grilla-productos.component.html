<div class="ed-grid">
  <!-- Si hay productos -->
  <ng-container *ngIf="(productos?.length || 0) > 0; else edPlaceholders">
    <ed-web-tarjeta-producto
      *ngFor="let p of productos"
      [producto]="p"
      (openDetail)="openDetail.emit(p)"
      (addToCart)="addToCart.emit(p)">
    </ed-web-tarjeta-producto>
  </ng-container>

  <!-- Placeholders si no hay datos -->
  <ng-template #edPlaceholders>
    <div class="ed-card-ph" *ngFor="let _ of [1,2,3,4,5,6,7,8]">
      <div class="ed-skeleton ed-skeleton--img"></div>
      <div class="ed-skeleton ed-skeleton--text" style="width: 85%"></div>
      <div class="ed-skeleton ed-skeleton--text" style="width: 60%"></div>
      <div class="ed-skeleton ed-skeleton--btn"></div>
    </div>
  </ng-template>
</div>
