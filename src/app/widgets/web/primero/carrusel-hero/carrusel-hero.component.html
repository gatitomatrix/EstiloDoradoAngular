<div id="edHeroCarousel" class="carousel slide ed-hero" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#edHeroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#edHeroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#edHeroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>

  <div class="carousel-inner">
    <!-- Pon tus imágenes en: public/images/banners/ -->
    <div class="carousel-item active">
      <img src="https://i.imgur.com/Fc0mPrR.png" class="d-block w-100" alt="Banner 1">
      <div class="carousel-caption d-none d-md-block">
        <!-- Texto opcional -->
      </div>
    </div>
    <div class="carousel-item">
      <img src="https://i.imgur.com/LbGxAjc.png" class="d-block w-100" alt="Banner 2">
    </div>
    <div class="carousel-item">
      <img src="https://i.imgur.com/wZI14aD.png" class="d-block w-100" alt="Banner 3">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#edHeroCarousel" data-bs-slide="prev" aria-label="Anterior">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#edHeroCarousel" data-bs-slide="next" aria-label="Siguiente">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>
