<div id="edHeroCarousel" class="carousel slide ed-hero" data-bs-ride="carousel" data-bs-interval="7000">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#edHeroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#edHeroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#edHeroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active" data-bs-interval="7000">
      <img src="https://i.imgur.com/Lz3mumi.png" class="d-block w-100" alt="Estilo Dorado">
    </div>
    <div class="carousel-item" data-bs-interval="7000">
      <img src="https://i.imgur.com/bG9AmNv.png" class="d-block w-100" alt="Estilo Dorado">
    </div>
    <div class="carousel-item" data-bs-interval="7000">
      <img src="https://i.imgur.com/9b8uchv.png" class="d-block w-100" alt="Estilo Dorado">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#edHeroCarousel" data-bs-slide="prev" aria-label="Anterior">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#edHeroCarousel" data-bs-slide="next" aria-label="Siguiente">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>
