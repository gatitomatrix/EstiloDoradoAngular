<aside class="ed-panel-filtros">
  <div class="ed-panel-filtros__header">
    <h3>Filtros</h3>
    <button type="button" class="ed-btn-clear ed-btn-clear--link" (click)="limpiarTodo()">Limpiar todo</button>
  </div>

  <section class="ed-filter-group">
    <h4 class="ed-filter-group__title">Categorías</h4>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="cat" id="cat-all"
             [checked]="selectedId == null" (change)="limpiar()">
      <label class="form-check-label" for="cat-all">Todas</label>
    </div>
    <div *ngFor="let c of categorias" class="form-check mb-2">
      <input class="form-check-input" type="radio" name="cat"
             [id]="'cat-'+c.id_categoria"
             [value]="c.id_categoria"
             [checked]="c.id_categoria===selectedId"
             (change)="onSelect(c.id_categoria, c.nombre)">
      <label class="form-check-label" [for]="'cat-'+c.id_categoria">{{ labelOf(c) }}</label>
    </div>
  </section>

  <section class="ed-filter-group">
    <h4 class="ed-filter-group__title">Precio</h4>
    <div class="ed-filter-group__content">
      <div class="ed-price-row">
        <input
          type="number"
          class="ed-price-input"
          placeholder="Mín."
          [min]="precioMinDisponible"
          [max]="precioMaxDisponible"
          [(ngModel)]="precioMinSel"
          (change)="onChangePrecio()"
          (blur)="onChangePrecio()"
        />
        <span>—</span>
        <input
          type="number"
          class="ed-price-input"
          placeholder="Máx."
          [min]="precioMinDisponible"
          [max]="precioMaxDisponible"
          [(ngModel)]="precioMaxSel"
          (change)="onChangePrecio()"
          (blur)="onChangePrecio()"
        />
      </div>
      <small class="ed-help">
        Rango disponible: S/ {{ precioMinDisponible | number:'1.2-2' }} — S/ {{ precioMaxDisponible | number:'1.2-2' }}.
        Si escribes fuera de ese rango, se ajusta solo.
      </small>
    </div>
  </section>
</aside>
